<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Catch the Red Ball</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* -------------------------
           CAMERA
           ------------------------- */

        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* -------------------------
           GAME
           ------------------------- */

        #game {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /* -------------------------
           RED BALL
           ------------------------- */

        #ball {

            position: absolute;

            width: 70px;
            height: 70px;

            background: red;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            pointer-events: auto;

            box-shadow:
                0 0 15px
                rgba(255, 0, 0, 0.8);
        }


        /* -------------------------
           START BUTTON
           ------------------------- */

        #startButton {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            padding: 15px 25px;

            font-size: 20px;

            z-index: 10;

            pointer-events: auto;
        }


        /* -------------------------
           SENSOR DISPLAY
           ------------------------- */

        #sensorDisplay {

            position: absolute;

            top: 20px;
            left: 20px;

            padding: 12px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-family: monospace;

            font-size: 16px;

            line-height: 1.5;

            border-radius: 8px;

            z-index: 20;

            pointer-events: none;
        }

    </style>

</head>


<body>


    <!-- Camera -->

    <video id="camera"
           autoplay
           playsinline>
    </video>


    <!-- Game -->

    <div id="game">


        <!-- Red ball -->

        <div id="ball"></div>


        <!-- Start button -->

        <button id="startButton">
            Start Game
        </button>


        <!-- Sensor values -->

        <div id="sensorDisplay">

            Alpha: <span id="alpha">---</span><br>

            Beta: <span id="beta">---</span><br>

            Gamma: <span id="gamma">---</span>

        </div>


    </div>


    <script>


        /* -------------------------
           HTML ELEMENTS
           ------------------------- */

        const camera =
            document.getElementById("camera");

        const ball =
            document.getElementById("ball");

        const startButton =
            document.getElementById(
                "startButton"
            );


        const alphaDisplay =
            document.getElementById(
                "alpha"
            );

        const betaDisplay =
            document.getElementById(
                "beta"
            );

        const gammaDisplay =
            document.getElementById(
                "gamma"
            );


        /* -------------------------
           CAMERA
           ------------------------- */

        async function startCamera() {

            try {

                const stream =
                    await navigator.mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode: {
                                    ideal:
                                        "environment"
                                }

                            },

                            audio: false

                        });


                camera.srcObject =
                    stream;

            }

            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                alert(
                    "Could not access camera.\n\n" +
                    error.name +
                    "\n\n" +
                    error.message
                );

            }

        }


        /* -------------------------
           MOVE BALL
           ------------------------- */

        function moveBall() {

            const ballSize = 70;


            const x =
                Math.random() *
                (window.innerWidth -
                    ballSize)
                +
                ballSize / 2;


            const y =
                Math.random() *
                (window.innerHeight -
                    ballSize)
                +
                ballSize / 2;


            ball.style.left =
                x + "px";

            ball.style.top =
                y + "px";

        }


        /* -------------------------
           DEVICE ORIENTATION
           ------------------------- */

        function handleOrientation(event) {

            /*
             * Alpha:
             * Rotation around the
             * vertical axis.
             */

            let alpha =
                event.alpha;


            /*
             * Beta:
             * Front/back tilt.
             */

            let beta =
                event.beta;


            /*
             * Gamma:
             * Left/right tilt.
             */

            let gamma =
                event.gamma;


            /*
             * Display values.
             */

            if (alpha !== null) {

                alphaDisplay.textContent =
                    alpha.toFixed(1);

            }


            if (beta !== null) {

                betaDisplay.textContent =
                    beta.toFixed(1);

            }


            if (gamma !== null) {

                gammaDisplay.textContent =
                    gamma.toFixed(1);

            }

        }


        /* -------------------------
           START GAME
           ------------------------- */

        startButton.addEventListener(
            "click",
            async function() {


                console.log(
                    "Start Game clicked"
                );


                /*
                 * Start camera.
                 */

                await startCamera();


                /*
                 * Start listening for
                 * phone orientation.
                 */

                if (
                    typeof DeviceOrientationEvent
                    !== "undefined"
                ) {


                    /*
                     * Some browsers,
                     * particularly iOS,
                     * require explicit
                     * permission.
                     */

                    if (
                        typeof DeviceOrientationEvent
                            .requestPermission
                        === "function"
                    ) {

                        try {

                            const permission =
                                await
                                DeviceOrientationEvent
                                    .requestPermission();


                            if (
                                permission
                                === "granted"
                            ) {

                                window.addEventListener(
                                    "deviceorientation",
                                    handleOrientation
                                );

                            }
                            else {

                                alert(
                                    "Motion permission was not granted."
                                );

                            }

                        }
                        catch (error) {

                            console.error(
                                "Orientation permission error:",
                                error
                            );

                        }

                    }

                    else {

                        /*
                         * Android and browsers
                         * that don't require
                         * explicit permission.
                         */

                        window.addEventListener(
                            "deviceorientation",
                            handleOrientation
                        );

                    }

                }
                else {

                    alert(
                        "Device orientation is not supported by this browser."
                    );

                }


                /*
                 * Hide start button.
                 */

                startButton.style.display =
                    "none";


                /*
                 * Put ball somewhere.
                 */

                moveBall();

            }
        );


        /* -------------------------
           BALL TOUCH
           ------------------------- */

        ball.addEventListener(
            "click",
            function() {


                ball.style.display =
                    "none";


                setTimeout(
                    function() {

                        moveBall();

                        ball.style.display =
                            "block";

                    },
                    500
                );

            }
        );


        /* -------------------------
           INITIAL BALL
           ------------------------- */

        moveBall();


    </script>

</body>

</html>
