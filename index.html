<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Catch the Red Ball</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* =========================
           CAMERA
           ========================= */

        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* =========================
           GAME
           ========================= */

        #game {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           PLAYER BALL
           ========================= */

        #ball {

            position: absolute;

            width: 60px;
            height: 60px;

            background: red;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            box-shadow:
                0 0 18px
                rgba(255, 0, 0, 0.9);
        }


        /* =========================
           TARGET
           ========================= */

        #target {

            position: absolute;

            width: 90px;
            height: 90px;

            border: 5px solid white;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            box-shadow:
                0 0 15px
                rgba(255, 255, 255, 0.8);
        }


        #target::after {

            content: "";

            position: absolute;

            width: 25px;
            height: 25px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background: white;

            border-radius: 50%;
        }


        /* =========================
           CONTROLS
           ========================= */

        #controls {

            position: absolute;

            bottom: 30px;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 30;

            pointer-events: auto;
        }


        button {

            padding: 12px 18px;

            font-size: 16px;

            border: none;

            border-radius: 8px;

            background: white;

            color: black;
        }


        button:disabled {

            opacity: 0.5;
        }


        /* =========================
           STATUS
           ========================= */

        #status {

            position: absolute;

            top: 20px;
            left: 20px;
            right: 20px;

            padding: 12px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 16px;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;

            text-align: center;
        }


        /* =========================
           SCORE
           ========================= */

        #score {

            position: absolute;

            top: 85px;
            right: 20px;

            padding: 10px 15px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 20px;

            font-weight: bold;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;
        }


        /* =========================
           DEBUG
           ========================= */

        #debug {

            position: absolute;

            top: 85px;
            left: 20px;

            padding: 10px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-family: monospace;

            font-size: 12px;

            line-height: 1.5;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;
        }

    </style>

</head>


<body>


<!-- =========================
     CAMERA
     ========================= -->

<video id="camera"
       autoplay
       playsinline>
</video>


<!-- =========================
     GAME
     ========================= -->

<div id="game">


    <!-- Player ball -->

    <div id="ball"></div>


    <!-- Target -->

    <div id="target"></div>


    <!-- Status -->

    <div id="status">

        Place phone flat on table,
        then press Calibrate.

    </div>


    <!-- Score -->

    <div id="score">

        Score: 0

    </div>


    <!-- Debug -->

    <div id="debug">

        Beta:
        <span id="beta">---</span>

        <br>

        Gamma:
        <span id="gamma">---</span>

        <br>

        Calibrated Beta:
        <span id="calBeta">---</span>

        <br>

        Calibrated Gamma:
        <span id="calGamma">---</span>

        <br>

        Velocity X:
        <span id="velocityX">0</span>

        <br>

        Velocity Y:
        <span id="velocityY">0</span>

    </div>


    <!-- Controls -->

    <div id="controls">

        <button id="calibrateButton">
            Calibrate
        </button>

        <button id="startButton">
            Start Game
        </button>

    </div>


</div>


<script>


/* =========================
   HTML ELEMENTS
   ========================= */

const camera =
    document.getElementById(
        "camera"
    );


const ball =
    document.getElementById(
        "ball"
    );


const target =
    document.getElementById(
        "target"
    );


const statusDisplay =
    document.getElementById(
        "status"
    );


const scoreDisplay =
    document.getElementById(
        "score"
    );


const calibrateButton =
    document.getElementById(
        "calibrateButton"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const betaDisplay =
    document.getElementById(
        "beta"
    );


const gammaDisplay =
    document.getElementById(
        "gamma"
    );


const calBetaDisplay =
    document.getElementById(
        "calBeta"
    );


const calGammaDisplay =
    document.getElementById(
        "calGamma"
    );


const velocityXDisplay =
    document.getElementById(
        "velocityX"
    );


const velocityYDisplay =
    document.getElementById(
        "velocityY"
    );


/* =========================
   BALL POSITION
   ========================= */

let ballX =
    window.innerWidth / 2;

let ballY =
    window.innerHeight / 2;


/* =========================
   BALL VELOCITY
   ========================= */

let velocityX = 0;

let velocityY = 0;


/* =========================
   TARGET POSITION
   ========================= */

let targetX =
    window.innerWidth * 0.75;

let targetY =
    window.innerHeight * 0.5;


/* =========================
   SENSOR VALUES
   ========================= */

let lastBeta = null;

let lastGamma = null;

let calibratedBeta = null;

let calibratedGamma = null;


/*
 * Has the orientation listener
 * already been started?
 */

let sensorActive = false;


/*
 * Has the game started?
 */

let gameStarted = false;


/*
 * Score.
 */

let score = 0;


/* =========================
   PHYSICS SETTINGS
   ========================= */

const acceleration =
    0.15;

const maxSpeed =
    8;

const friction =
    0.92;

const deadZone =
    3;


/* =========================
   COLLISION SETTINGS
   ========================= */

const ballRadius =
    30;

const targetRadius =
    45;

const catchDistance =
    ballRadius +
    targetRadius;


/* =========================
   CAMERA
   ========================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        }

                    },

                    audio: false

                });


        camera.srcObject =
            stream;


        return true;

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        statusDisplay.textContent =
            "Camera error: " +
            error.message;


        return false;

    }

}


/* =========================
   START SENSOR
   ========================= */

async function startSensors() {

    /*
     * If the sensor is already
     * active, don't add another
     * event listener.
     */

    if (sensorActive) {

        return true;

    }


    /*
     * iPhone Safari.
     */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission !==
                "granted"
            ) {

                statusDisplay.textContent =
                    "Motion permission denied.";

                return false;

            }

        }

        catch (error) {

            console.error(
                "Motion permission error:",
                error
            );


            statusDisplay.textContent =
                "Motion permission error: " +
                error.message;


            return false;

        }

    }


    /*
     * Start receiving orientation
     * data.
     */

    window.addEventListener(
        "deviceorientation",
        handleOrientation
    );


    sensorActive =
        true;


    statusDisplay.textContent =
        "Sensor active. " +
        "Calibrating...";


    return true;

}


/* =========================
   ORIENTATION HANDLER
   ========================= */

function handleOrientation(event) {

    /*
     * Store sensor values.
     */

    if (
        event.beta !== null
    ) {

        lastBeta =
            event.beta;

    }


    if (
        event.gamma !== null
    ) {

        lastGamma =
            event.gamma;

    }


    /*
     * Display values.
     */

    if (
        lastBeta !== null
    ) {

        betaDisplay.textContent =
            lastBeta.toFixed(1);

    }


    if (
        lastGamma !== null
    ) {

        gammaDisplay.textContent =
            lastGamma.toFixed(1);

    }


    /*
     * Don't control the ball
     * until the game starts.
     */

    if (
        !gameStarted
    ) {

        return;

    }


    /*
     * Need calibration first.
     */

    if (
        calibratedBeta === null ||
        calibratedGamma === null
    ) {

        return;

    }


    /*
     * Calculate tilt from
     * calibrated orientation.
     */

    let horizontalTilt =
        lastGamma -
        calibratedGamma;


    let verticalTilt =
        lastBeta -
        calibratedBeta;


    /*
     * Dead zone.
     */

    if (
        Math.abs(horizontalTilt)
        < deadZone
    ) {

        horizontalTilt = 0;

    }


    if (
        Math.abs(verticalTilt)
        < deadZone
    ) {

        verticalTilt = 0;

    }


    /*
     * Apply acceleration.
     */

    velocityX +=
        horizontalTilt *
        acceleration;


    velocityY +=
        verticalTilt *
        acceleration;


    /*
     * Limit maximum speed.
     */

    velocityX =
        Math.max(
            -maxSpeed,
            Math.min(
                maxSpeed,
                velocityX
            )
        );


    velocityY =
        Math.max(
            -maxSpeed,
            Math.min(
                maxSpeed,
                velocityY
            )
        );

}


/* =========================
   CALIBRATE
   ========================= */

async function calibrate() {

    /*
     * FIRST:
     * Start the sensor.
     */

    if (
        !sensorActive
    ) {

        const success =
            await startSensors();


        if (
            !success
        ) {

            return;

        }

    }


    /*
     * Sensor permission has now
     * been granted, but the browser
     * may need a moment to deliver
     * the first sensor event.
     */

    if (
        lastBeta === null ||
        lastGamma === null
    ) {

        statusDisplay.textContent =
            "Sensor active. " +
            "Hold phone still...";


        /*
         * Wait for sensor data.
         */

        waitForSensorCalibration();

        return;

    }


    completeCalibration();

}


/* =========================
   WAIT FOR SENSOR
   ========================= */

function waitForSensorCalibration() {

    /*
     * Check again after 100 ms.
     */

    setTimeout(
        function() {

            if (
                lastBeta !== null &&
                lastGamma !== null
            ) {

                completeCalibration();

            }

            else {

                waitForSensorCalibration();

            }

        },
        100
    );

}


/* =========================
   COMPLETE CALIBRATION
   ========================= */

function completeCalibration() {

    /*
     * Save current orientation.
     */

    calibratedBeta =
        lastBeta;

    calibratedGamma =
        lastGamma;


    /*
     * Display calibration.
     */

    calBetaDisplay.textContent =
        calibratedBeta.toFixed(1);


    calGammaDisplay.textContent =
        calibratedGamma.toFixed(1);


    /*
     * Reset velocity.
     */

    velocityX = 0;

    velocityY = 0;


    /*
     * Update status.

     */

    statusDisplay.textContent =
        "Calibration complete. " +
        "Press Start Game.";


    /*
     * Enable Start Game.

     */

    startButton.disabled =
        false;

}


/* =========================
   MOVE TARGET
   ========================= */

function moveTarget() {

    const margin = 100;


    targetX =
        margin +
        Math.random() *
        (
            window.innerWidth -
            margin * 2
        );


    targetY =
        margin +
        Math.random() *
        (
            window.innerHeight -
            margin * 2
        );


    target.style.left =
        targetX + "px";


    target.style.top =
        targetY + "px";

}


/* =========================
   COLLISION
   ========================= */

function checkCollision() {

    const dx =
        ballX -
        targetX;


    const dy =
        ballY -
        targetY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance <
        catchDistance
    ) {

        catchTarget();

    }

}


/* =========================
   CATCH TARGET
   ========================= */

function catchTarget() {

    score++;


    scoreDisplay.textContent =
        "Score: " +
        score;


    velocityX = 0;

    velocityY = 0;


    moveTarget();


    statusDisplay.textContent =
        "CAUGHT! 🎯";


    setTimeout(
        function() {

            if (
                gameStarted
            ) {

                statusDisplay.textContent =
                    "Find the next target!";

            }

        },
        700
    );

}


/* =========================
   BALL PHYSICS
   ========================= */

function updateBall() {

    /*
     * Move ball.
     */

    ballX +=
        velocityX;

    ballY +=
        velocityY;


    /*
     * Friction.
     */

    velocityX *=
        friction;

    velocityY *=
        friction;


    /*
     * Keep ball on screen.
     */

    if (
        ballX <
        ballRadius
    ) {

        ballX =
            ballRadius;

        velocityX *=
            -0.5;

    }


    if (
        ballX >
        window.innerWidth -
        ballRadius
    ) {

        ballX =
            window.innerWidth -
            ballRadius;

        velocityX *=
            -0.5;

    }


    if (
        ballY <
        ballRadius
    ) {

        ballY =
            ballRadius;

        velocityY *=
            -0.5;

    }


    if (
        ballY >
        window.innerHeight -
        ballRadius
    ) {

        ballY =
            window.innerHeight -
            ballRadius;

        velocityY *=
            -0.5;

    }


    /*
     * Update ball graphics.
     */

    ball.style.left =
        ballX + "px";

    ball.style.top =
        ballY + "px";


    /*
     * Debug information.
     */

    velocityXDisplay.textContent =
        velocityX.toFixed(2);

    velocityYDisplay.textContent =
        velocityY.toFixed(2);


    /*
     * Check target collision.
     */

    checkCollision();

}


/* =========================
   GAME LOOP
   ========================= */

function gameLoop() {

    if (
        gameStarted
    ) {

        updateBall();

    }


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =========================
   CALIBRATE BUTTON
   ========================= */

calibrateButton.addEventListener(
    "click",
    function() {

        calibrate();

    }
);


/* =========================
   START GAME BUTTON
   ========================= */

startButton.addEventListener(
    "click",
    async function() {

        /*
         * Calibration must have
         * already happened.
         */

        if (
            calibratedBeta === null ||
            calibratedGamma === null
        ) {

            statusDisplay.textContent =
                "Please calibrate first.";

            return;

        }


        /*
         * Camera is requested ONLY
         * when Start Game is pressed.
         */

        const cameraStarted =
            await startCamera();


        if (
            !cameraStarted
        ) {

            return;

        }


        /*
         * Reset ball.
         */

        ballX =
            window.innerWidth / 2;

        ballY =
            window.innerHeight / 2;


        velocityX = 0;

        velocityY = 0;


        /*
         * Reset score.
         */

        score = 0;

        scoreDisplay.textContent =
            "Score: 0";


        /*
         * Create target.
         */

        moveTarget();


        /*
         * Start game.
         */

        gameStarted =
            true;


        /*
         * Update status.

         */

        statusDisplay.textContent =
            "Find the target!";


        /*
         * Disable controls.
         */

        calibrateButton.disabled =
            true;

        startButton.disabled =
            true;

    }
);


/* =========================
   INITIAL POSITION
   ========================= */

ball.style.left =
    ballX + "px";


ball.style.top =
    ballY + "px";


moveTarget();


/*
 * Start with Start Game
 * disabled until calibration.
 */

startButton.disabled =
    true;


</script>

</body>

</html>
