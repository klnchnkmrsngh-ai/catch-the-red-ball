<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>iPhone Sensor Test</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: black;

            color: white;

            font-family: Arial, sans-serif;
        }


        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        #overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            padding: 20px;

            pointer-events: none;
        }


        #sensorDisplay {

            background:
                rgba(0, 0, 0, 0.75);

            padding: 15px;

            border-radius: 10px;

            font-family: monospace;

            font-size: 18px;

            line-height: 1.6;
        }


        #startButton {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            padding: 20px 30px;

            font-size: 20px;

            pointer-events: auto;
        }

    </style>

</head>


<body>


<video id="camera"
       autoplay
       playsinline>
</video>


<div id="overlay">


    <div id="sensorDisplay">

        Status:
        <span id="status">
            Waiting
        </span>

        <br><br>

        Alpha:
        <span id="alpha">---</span>

        <br>

        Beta:
        <span id="beta">---</span>

        <br>

        Gamma:
        <span id="gamma">---</span>

        <br><br>

        Error:
        <span id="error">---</span>

    </div>


    <button id="startButton">
        Start Sensor Test
    </button>


</div>


<script>


const camera =
    document.getElementById(
        "camera"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const status =
    document.getElementById(
        "status"
    );


const errorDisplay =
    document.getElementById(
        "error"
    );


const alphaDisplay =
    document.getElementById(
        "alpha"
    );


const betaDisplay =
    document.getElementById(
        "beta"
    );


const gammaDisplay =
    document.getElementById(
        "gamma"
    );


/* -------------------------
   SENSOR DATA
   ------------------------- */

function handleOrientation(event) {

    status.textContent =
        "Sensor working";


    alphaDisplay.textContent =
        event.alpha === null
        ? "null"
        : event.alpha.toFixed(2);


    betaDisplay.textContent =
        event.beta === null
        ? "null"
        : event.beta.toFixed(2);


    gammaDisplay.textContent =
        event.gamma === null
        ? "null"
        : event.gamma.toFixed(2);

}


/* -------------------------
   START
   ------------------------- */

startButton.addEventListener(
    "click",
    async function() {


        startButton.style.display =
            "none";


        /*
         * FIRST:
         * Request motion permission.
         */

        status.textContent =
            "Requesting motion permission...";


        if (
            typeof DeviceOrientationEvent ===
            "undefined"
        ) {

            status.textContent =
                "DeviceOrientationEvent not supported";

            return;
        }


        /*
         * iPhone Safari
         */

        if (
            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ) {

            try {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    status.textContent =
                        "Motion permission granted";


                    window.addEventListener(
                        "deviceorientation",
                        handleOrientation
                    );

                }

                else {

                    status.textContent =
                        "Permission denied";

                }

            }

            catch (err) {

                status.textContent =
                    "Permission request failed";

                errorDisplay.textContent =
                    err.name +
                    ": " +
                    err.message;

                console.error(err);

            }

        }

        else {

            /*
             * Non-iPhone browsers.
             */

            status.textContent =
                "Listening for sensor";


            window.addEventListener(
                "deviceorientation",
                handleOrientation
            );

        }


        /*
         * SECOND:
         * Start the camera separately.
         */

        try {

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode: {
                                ideal:
                                    "environment"
                            }

                        },

                        audio: false

                    });


            camera.srcObject =
                stream;

        }

        catch (err) {

            console.error(
                "Camera error:",
                err
            );

        }

    }
);

</script>

</body>

</html>
