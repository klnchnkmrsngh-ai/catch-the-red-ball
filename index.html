<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Catch the Red Ball</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* =========================
           CAMERA
           ========================= */

        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* =========================
           GAME
           ========================= */

        #game {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           PLAYER BALL
           ========================= */

        #ball {

            position: absolute;

            width: 60px;
            height: 60px;

            background: red;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            box-shadow:
                0 0 18px
                rgba(255, 0, 0, 0.9);
        }


        /* =========================
           TARGET
           ========================= */

        #target {

            position: absolute;

            width: 90px;
            height: 90px;

            border: 5px solid white;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            box-shadow:
                0 0 15px
                rgba(255, 255, 255, 0.8);
        }


        /*
         * Inner part of target.
         */

        #target::after {

            content: "";

            position: absolute;

            width: 25px;
            height: 25px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background: white;

            border-radius: 50%;
        }


        /* =========================
           CONTROLS
           ========================= */

        #controls {

            position: absolute;

            bottom: 30px;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 30;

            pointer-events: auto;
        }


        button {

            padding: 12px 18px;

            font-size: 16px;

            border: none;

            border-radius: 8px;

            background: white;

            color: black;
        }


        button:disabled {

            opacity: 0.5;
        }


        /* =========================
           STATUS
           ========================= */

        #status {

            position: absolute;

            top: 20px;
            left: 20px;
            right: 20px;

            padding: 12px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 16px;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;

            text-align: center;
        }


        /* =========================
           SCORE
           ========================= */

        #score {

            position: absolute;

            top: 85px;
            right: 20px;

            padding: 10px 15px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 20px;

            font-weight: bold;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;
        }


        /* =========================
           DEBUG
           ========================= */

        #debug {

            position: absolute;

            top: 85px;
            left: 20px;

            padding: 10px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-family: monospace;

            font-size: 12px;

            line-height: 1.5;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;
        }

    </style>

</head>


<body>


<!-- =========================
     CAMERA
     ========================= -->

<video id="camera"
       autoplay
       playsinline>
</video>


<!-- =========================
     GAME
     ========================= -->

<div id="game">


    <!-- Player ball -->

    <div id="ball"></div>


    <!-- Target -->

    <div id="target"></div>


    <!-- Status -->

    <div id="status">

        Place phone flat on table,
        then press Calibrate.

    </div>


    <!-- Score -->

    <div id="score">

        Score: 0

    </div>


    <!-- Debug -->

    <div id="debug">

        Beta:
        <span id="beta">---</span>

        <br>

        Gamma:
        <span id="gamma">---</span>

        <br>

        Velocity X:
        <span id="velocityX">0</span>

        <br>

        Velocity Y:
        <span id="velocityY">0</span>

    </div>


    <!-- Controls -->

    <div id="controls">

        <button id="calibrateButton">
            Calibrate
        </button>

        <button id="startButton">
            Start Game
        </button>

    </div>


</div>


<script>


/* =========================
   HTML ELEMENTS
   ========================= */

const camera =
    document.getElementById(
        "camera"
    );


const ball =
    document.getElementById(
        "ball"
    );


const target =
    document.getElementById(
        "target"
    );


const statusDisplay =
    document.getElementById(
        "status"
    );


const scoreDisplay =
    document.getElementById(
        "score"
    );


const calibrateButton =
    document.getElementById(
        "calibrateButton"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const betaDisplay =
    document.getElementById(
        "beta"
    );


const gammaDisplay =
    document.getElementById(
        "gamma"
    );


const velocityXDisplay =
    document.getElementById(
        "velocityX"
    );


const velocityYDisplay =
    document.getElementById(
        "velocityY"
    );


/* =========================
   BALL POSITION
   ========================= */

let ballX =
    window.innerWidth / 2;


let ballY =
    window.innerHeight / 2;


/* =========================
   BALL VELOCITY
   ========================= */

let velocityX = 0;

let velocityY = 0;


/* =========================
   TARGET POSITION
   ========================= */

let targetX =
    window.innerWidth * 0.75;


let targetY =
    window.innerHeight * 0.5;


/* =========================
   SENSOR
   ========================= */

let lastBeta = null;

let lastGamma = null;

let calibratedBeta = null;

let calibratedGamma = null;

let sensorActive = false;


/* =========================
   GAME STATE
   ========================= */

let gameStarted = false;

let score = 0;


/* =========================
   PHYSICS SETTINGS
   ========================= */

const acceleration =
    0.15;


const maxSpeed =
    8;


const friction =
    0.92;


const deadZone =
    3;


/* =========================
   COLLISION SETTINGS
   ========================= */

const ballRadius =
    30;


const targetRadius =
    45;


/*
 * How close the ball needs
 * to get to the target.
 */

const catchDistance =
    ballRadius +
    targetRadius;


/* =========================
   CAMERA
   ========================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        }

                    },

                    audio: false

                });


        camera.srcObject =
            stream;

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        statusDisplay.textContent =
            "Camera error: " +
            error.message;

    }

}


/* =========================
   CREATE TARGET
   ========================= */

function moveTarget() {

    /*
     * Keep the target away
     * from the edges.
     */

    const margin = 100;


    targetX =
        margin +
        Math.random() *
        (
            window.innerWidth -
            margin * 2
        );


    targetY =
        margin +
        Math.random() *
        (
            window.innerHeight -
            margin * 2
        );


    /*
     * Move target visually.
     */

    target.style.left =
        targetX + "px";


    target.style.top =
        targetY + "px";

}


/* =========================
   CALIBRATION
   ========================= */

function calibrate() {

    if (
        lastBeta === null ||
        lastGamma === null
    ) {

        statusDisplay.textContent =
            "Waiting for sensor data...";

        return;

    }


    calibratedBeta =
        lastBeta;


    calibratedGamma =
        lastGamma;


    velocityX = 0;

    velocityY = 0;


    statusDisplay.textContent =
        "Calibration complete. " +
        "Press Start Game.";

}


/* =========================
   ORIENTATION
   ========================= */

function handleOrientation(event) {

    if (
        event.beta !== null
    ) {

        lastBeta =
            event.beta;

    }


    if (
        event.gamma !== null
    ) {

        lastGamma =
            event.gamma;

    }


    /*
     * Display sensor values.
     */

    if (
        lastBeta !== null
    ) {

        betaDisplay.textContent =
            lastBeta.toFixed(1);

    }


    if (
        lastGamma !== null
    ) {

        gammaDisplay.textContent =
            lastGamma.toFixed(1);

    }


    /*
     * Don't control ball
     * until game starts.
     */

    if (
        !gameStarted
    ) {

        return;

    }


    if (
        calibratedBeta === null ||
        calibratedGamma === null
    ) {

        return;

    }


    /*
     * Calculate tilt from
     * calibrated position.
     */

    let horizontalTilt =
        lastGamma -
        calibratedGamma;


    let verticalTilt =
        lastBeta -
        calibratedBeta;


    /*
     * Dead zone.
     */

    if (
        Math.abs(horizontalTilt)
        < deadZone
    ) {

        horizontalTilt = 0;

    }


    if (
        Math.abs(verticalTilt)
        < deadZone
    ) {

        verticalTilt = 0;

    }


    /*
     * Apply acceleration.
     */

    velocityX +=
        horizontalTilt *
        acceleration;


    velocityY +=
        verticalTilt *
        acceleration;


    /*
     * Maximum speed.
     */

    velocityX =
        Math.max(
            -maxSpeed,
            Math.min(
                maxSpeed,
                velocityX
            )
        );


    velocityY =
        Math.max(
            -maxSpeed,
            Math.min(
                maxSpeed,
                velocityY
            )
        );

}


/* =========================
   COLLISION DETECTION
   ========================= */

function checkCollision() {

    const dx =
        ballX -
        targetX;


    const dy =
        ballY -
        targetY;


    /*
     * Pythagoras:

       distance =
       sqrt(dx² + dy²)
    */

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
     * Have we reached
     * the target?
     */

    if (
        distance <
        catchDistance
    ) {

        catchTarget();

    }

}


/* =========================
   TARGET CAUGHT
   ========================= */

function catchTarget() {

    /*
     * Increase score.
     */

    score++;


    scoreDisplay.textContent =
        "Score: " +
        score;


    /*
     * Stop the ball briefly.
     */

    velocityX = 0;

    velocityY = 0;


    /*
     * Move target.
     */

    moveTarget();


    /*
     * Show feedback.
     */

    statusDisplay.textContent =
        "CAUGHT! 🎯";


    /*
     * Return to normal message.
     */

    setTimeout(
        function() {

            if (gameStarted) {

                statusDisplay.textContent =
                    "Find the next target!";

            }

        },
        700
    );

}


/* =========================
   BALL PHYSICS
   ========================= */

function updateBall() {

    /*
     * Move according to
     * velocity.
     */

    ballX +=
        velocityX;


    ballY +=
        velocityY;


    /*
     * Apply friction.
     */

    velocityX *=
        friction;


    velocityY *=
        friction;


    /*
     * Keep ball inside screen.
     */

    if (
        ballX < ballRadius
    ) {

        ballX =
            ballRadius;

        velocityX *=
            -0.5;

    }


    if (
        ballX >
        window.innerWidth -
        ballRadius
    ) {

        ballX =
            window.innerWidth -
            ballRadius;

        velocityX *=
            -0.5;

    }


    if (
        ballY < ballRadius
    ) {

        ballY =
            ballRadius;

        velocityY *=
            -0.5;

    }


    if (
        ballY >
        window.innerHeight -
        ballRadius
    ) {

        ballY =
            window.innerHeight -
            ballRadius;

        velocityY *=
            -0.5;

    }


    /*
     * Update ball position.
     */

    ball.style.left =
        ballX + "px";


    ball.style.top =
        ballY + "px";


    /*
     * Debug display.
     */

    velocityXDisplay.textContent =
        velocityX.toFixed(2);


    velocityYDisplay.textContent =
        velocityY.toFixed(2);


    /*
     * Check whether ball
     * reached target.
     */

    checkCollision();

}


/* =========================
   GAME LOOP
   ========================= */

function gameLoop() {

    if (
        gameStarted
    ) {

        updateBall();

    }


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =========================
   START SENSOR
   ========================= */

async function startSensors() {

    /*
     * iPhone Safari.
     */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission ===
                "granted"
            ) {

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                sensorActive =
                    true;

                return true;

            }

            else {

                statusDisplay.textContent =
                    "Motion permission denied.";

                return false;

            }

        }

        catch (error) {

            console.error(
                error
            );

            statusDisplay.textContent =
                "Motion permission error.";

            return false;

        }

    }


    /*
     * Other browsers.
     */

    window.addEventListener(
        "deviceorientation",
        handleOrientation
    );


    sensorActive =
        true;


    return true;

}


/* =========================
   CALIBRATE BUTTON
   ========================= */

calibrateButton.addEventListener(
    "click",
    function() {

        calibrate();

    }
);


/* =========================
   START GAME BUTTON
   ========================= */

startButton.addEventListener(
    "click",
    async function() {


        /*
         * Start sensors.
         */

        if (
            !sensorActive
        ) {

            const success =
                await startSensors();


            if (
                !success
            ) {

                return;

            }

        }


        /*
         * Make sure we have
         * calibration.
         */

        if (
            calibratedBeta === null ||
            calibratedGamma === null
        ) {

            statusDisplay.textContent =
                "Please calibrate first.";

            return;

        }


        /*
         * Start camera.
         */

        await startCamera();


        /*
         * Reset ball.
         */

        ballX =
            window.innerWidth / 2;


        ballY =
            window.innerHeight / 2;


        velocityX = 0;

        velocityY = 0;


        /*
         * Reset score.
         */

        score = 0;


        scoreDisplay.textContent =
            "Score: 0";


        /*
         * Create first target.
         */

        moveTarget();


        /*
         * Start game.

         */

        gameStarted =
            true;


        /*
         * Update UI.
         */

        statusDisplay.textContent =
            "Find the target!";


        calibrateButton.disabled =
            true;


        startButton.disabled =
            true;

    }
);


/* =========================
   INITIAL POSITIONS
   ========================= */

ball.style.left =
    ballX + "px";


ball.style.top =
    ballY + "px";


moveTarget();

</script>

</body>

</html>
