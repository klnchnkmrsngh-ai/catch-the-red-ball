<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Sensor Test</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: black;

            color: white;

            font-family: Arial, sans-serif;

            overflow: hidden;
        }

        #camera {
            position: fixed;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }

        #overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            padding: 20px;

            pointer-events: none;
        }

        #startButton {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 20px 30px;

            font-size: 20px;

            pointer-events: auto;
        }

        #sensorDisplay {

            background: rgba(0, 0, 0, 0.75);

            padding: 15px;

            border-radius: 10px;

            font-family: monospace;

            font-size: 18px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


<video id="camera"
       autoplay
       playsinline>
</video>


<div id="overlay">

    <div id="sensorDisplay">

        Sensor status: <span id="status">
            Waiting...
        </span>

        <br><br>

        Alpha:
        <span id="alpha">---</span>

        <br>

        Beta:
        <span id="beta">---</span>

        <br>

        Gamma:
        <span id="gamma">---</span>

    </div>


    <button id="startButton">
        Start Sensor Test
    </button>

</div>


<script>


const camera =
    document.getElementById("camera");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const alphaDisplay =
    document.getElementById("alpha");

const betaDisplay =
    document.getElementById("beta");

const gammaDisplay =
    document.getElementById("gamma");


/* -------------------------
   CAMERA
   ------------------------- */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        }
                    },

                    audio: false

                });

        camera.srcObject = stream;

    }

    catch (error) {

        status.textContent =
            "Camera error";

        console.error(error);

    }

}


/* -------------------------
   SENSOR EVENT
   ------------------------- */

function orientationHandler(event) {

    status.textContent =
        "Sensor events received";


    alphaDisplay.textContent =
        event.alpha === null
        ? "null"
        : event.alpha.toFixed(2);


    betaDisplay.textContent =
        event.beta === null
        ? "null"
        : event.beta.toFixed(2);


    gammaDisplay.textContent =
        event.gamma === null
        ? "null"
        : event.gamma.toFixed(2);

}


/* -------------------------
   START
   ------------------------- */

startButton.addEventListener(
    "click",
    async function() {

        startButton.style.display =
            "none";


        status.textContent =
            "Starting camera...";


        await startCamera();


        status.textContent =
            "Requesting motion permission...";


        /*
         * iPhone/iPad Safari requires
         * permission to use motion sensors.
         */

        if (
            typeof DeviceOrientationEvent !==
            "undefined" &&

            typeof DeviceOrientationEvent
                .requestPermission ===
                "function"
        ) {

            try {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (permission === "granted") {

                    status.textContent =
                        "Permission granted. Waiting for sensor...";


                    window.addEventListener(
                        "deviceorientation",
                        orientationHandler
                    );

                }

                else {

                    status.textContent =
                        "Motion permission DENIED";

                }

            }

            catch (error) {

                status.textContent =
                    "Permission error";

                console.error(error);

            }

        }

        else {

            /*
             * Browsers that don't require
             * an explicit permission request.
             */

            status.textContent =
                "Listening for sensor...";


            window.addEventListener(
                "deviceorientation",
                orientationHandler
            );

        }

    }
);

</script>

</body>

</html>
