<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Catch the Red Ball</title>

    <style>

        /* Remove default browser spacing */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* -------------------------
           CAMERA
           ------------------------- */

        #camera {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* -------------------------
           GAME OVERLAY
           ------------------------- */

        #game {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            /*
             * The overlay itself should not
             * block touches.
             */
            pointer-events: none;
        }


        /* -------------------------
           RED BALL
           ------------------------- */

        #ball {
            position: absolute;

            width: 70px;
            height: 70px;

            background: red;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            /*
             * Allow the player to touch
             * the ball.
             */
            pointer-events: auto;

            /*
             * Make it easier to see.
             */
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }


        /* -------------------------
           START BUTTON
           ------------------------- */

        #startButton {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 15px 25px;

            font-size: 20px;

            z-index: 10;

            /*
             * IMPORTANT:
             * The game overlay has
             * pointer-events: none.
             *
             * We must explicitly allow
             * the button to receive touches.
             */
            pointer-events: auto;
        }

    </style>

</head>


<body>


    <!--
        Camera video.

        The phone camera stream will
        be placed inside this element.
    -->

    <video id="camera"
           autoplay
           playsinline>
    </video>


    <!--
        Everything inside this element
        appears on top of the camera.
    -->

    <div id="game">


        <!-- Red target -->
        <div id="ball"></div>


        <!-- Start button -->
        <button id="startButton">
            Start Game
        </button>


    </div>


    <script>


        /* -------------------------
           GET HTML ELEMENTS
           ------------------------- */

        const camera =
            document.getElementById("camera");

        const ball =
            document.getElementById("ball");

        const startButton =
            document.getElementById("startButton");


        /* -------------------------
           START CAMERA
           ------------------------- */

        async function startCamera() {

            console.log("Start button pressed");

            try {

                /*
                 * Ask the browser for the
                 * rear-facing camera.
                 */

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },

                        audio: false

                    });


                /*
                 * Give the camera stream
                 * to the video element.
                 */

                camera.srcObject = stream;

                console.log("Camera started");

            }

            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                alert(
                    "Could not access the camera.\n\n" +
                    "Error: " +
                    error.name +
                    "\n\n" +
                    error.message
                );

            }

        }


        /* -------------------------
           MOVE BALL
           ------------------------- */

        function moveBall() {

            /*
             * Size of our ball.
             */

            const ballSize = 70;


            /*
             * Choose a random X position.
             */

            const x =
                Math.random() *
                (window.innerWidth - ballSize)
                +
                ballSize / 2;


            /*
             * Choose a random Y position.
             */

            const y =
                Math.random() *
                (window.innerHeight - ballSize)
                +
                ballSize / 2;


            /*
             * Apply the position.
             */

            ball.style.left = x + "px";

            ball.style.top = y + "px";


            console.log(
                "Ball moved to:",
                x,
                y
            );

        }


        /* -------------------------
           START BUTTON
           ------------------------- */

        startButton.addEventListener(
            "click",
            async function() {

                console.log(
                    "Start Game clicked"
                );


                /*
                 * Hide the button.
                 */

                startButton.style.display =
                    "none";


                /*
                 * Start camera.
                 */

                await startCamera();


                /*
                 * Put the ball somewhere
                 * on the screen.
                 */

                moveBall();

            }
        );


        /* -------------------------
           BALL TOUCHED
           ------------------------- */

        ball.addEventListener(
            "click",
            function() {

                console.log(
                    "Ball caught!"
                );


                /*
                 * Hide the ball.
                 */

                ball.style.display =
                    "none";


                /*
                 * Wait half a second,
                 * then create a new target.
                 */

                setTimeout(
                    function() {

                        moveBall();

                        ball.style.display =
                            "block";

                    },
                    500
                );

            }
        );


        /*
         * Initially place the ball
         * somewhere on the screen.
         */

        moveBall();


    </script>

</body>

</html>
