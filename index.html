<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Catch the Red Ball</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* =========================
           CAMERA
           ========================= */

        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* =========================
           GAME
           ========================= */

        #game {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           BALL
           ========================= */

        #ball {

            position: absolute;

            width: 70px;
            height: 70px;

            background: red;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: auto;

            box-shadow:
                0 0 15px
                rgba(255, 0, 0, 0.8);
        }


        /* =========================
           CONTROLS
           ========================= */

        #controls {

            position: absolute;

            bottom: 30px;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 10px;

            z-index: 30;

            pointer-events: auto;
        }


        button {

            padding: 12px 18px;

            font-size: 16px;

            border: none;

            border-radius: 8px;

            background: white;

            color: black;
        }


        button:disabled {

            opacity: 0.5;
        }


        /* =========================
           STATUS
           ========================= */

        #status {

            position: absolute;

            top: 20px;
            left: 20px;
            right: 20px;

            padding: 12px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 16px;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;

            text-align: center;
        }


        /* =========================
           DEBUG INFORMATION
           ========================= */

        #debug {

            position: absolute;

            top: 75px;
            left: 20px;

            padding: 12px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-family: monospace;

            font-size: 13px;

            line-height: 1.5;

            border-radius: 8px;

            z-index: 30;

            pointer-events: none;
        }

    </style>

</head>


<body>


<!-- =========================
     CAMERA
     ========================= -->

<video id="camera"
       autoplay
       playsinline>
</video>


<!-- =========================
     GAME
     ========================= -->

<div id="game">


    <!-- Red ball -->

    <div id="ball"></div>


    <!-- Status -->

    <div id="status">
        Place phone flat on table,
        then press Calibrate.
    </div>


    <!-- Debug information -->

    <div id="debug">

        Beta:
        <span id="beta">---</span>

        <br>

        Gamma:
        <span id="gamma">---</span>

        <br>

        Calibrated Beta:
        <span id="calBeta">---</span>

        <br>

        Calibrated Gamma:
        <span id="calGamma">---</span>

        <br>

        Velocity X:
        <span id="velocityX">0</span>

        <br>

        Velocity Y:
        <span id="velocityY">0</span>

    </div>


    <!-- Controls -->

    <div id="controls">

        <button id="calibrateButton">
            Calibrate
        </button>

        <button id="startButton">
            Start Game
        </button>

    </div>


</div>


<script>


/* =========================
   HTML ELEMENTS
   ========================= */

const camera =
    document.getElementById(
        "camera"
    );


const ball =
    document.getElementById(
        "ball"
    );


const statusDisplay =
    document.getElementById(
        "status"
    );


const calibrateButton =
    document.getElementById(
        "calibrateButton"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const betaDisplay =
    document.getElementById(
        "beta"
    );


const gammaDisplay =
    document.getElementById(
        "gamma"
    );


const calBetaDisplay =
    document.getElementById(
        "calBeta"
    );


const calGammaDisplay =
    document.getElementById(
        "calGamma"
    );


const velocityXDisplay =
    document.getElementById(
        "velocityX"
    );


const velocityYDisplay =
    document.getElementById(
        "velocityY"
    );


/* =========================
   BALL POSITION
   ========================= */

let ballX =
    window.innerWidth / 2;


let ballY =
    window.innerHeight / 2;


/* =========================
   BALL VELOCITY
   ========================= */

let velocityX = 0;

let velocityY = 0;


/* =========================
   CALIBRATION
   ========================= */

let calibratedBeta = null;

let calibratedGamma = null;


/* =========================
   GAME STATE
   ========================= */

let sensorActive = false;

let gameStarted = false;


/* =========================
   SETTINGS
   ========================= */


/*
 * How strongly the phone tilt
 * affects the ball acceleration.
 */

const acceleration =
    0.15;


/*
 * Maximum ball speed.
 */

const maxSpeed =
    8;


/*
 * Friction.

 * A value below 1 gradually
 * slows the ball down.
 */

const friction =
    0.92;


/*
 * Ignore very small movements.

 * This prevents sensor noise
 * from moving the ball.
 */

const deadZone =
    3;


/* =========================
   CAMERA
   ========================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        }

                    },

                    audio: false

                });


        camera.srcObject =
            stream;

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        statusDisplay.textContent =
            "Camera error: " +
            error.message;

    }

}


/* =========================
   CALIBRATION
   ========================= */

function calibrate() {

    /*
     * We can only calibrate if
     * sensor data has arrived.
     */

    if (
        lastBeta === null ||
        lastGamma === null
    ) {

        statusDisplay.textContent =
            "Waiting for sensor data...";

        return;

    }


    /*
     * Save the current orientation.
     */

    calibratedBeta =
        lastBeta;


    calibratedGamma =
        lastGamma;


    /*
     * Display calibration values.
     */

    calBetaDisplay.textContent =
        calibratedBeta.toFixed(1);


    calGammaDisplay.textContent =
        calibratedGamma.toFixed(1);


    /*
     * Reset ball velocity.
     */

    velocityX = 0;

    velocityY = 0;


    statusDisplay.textContent =
        "Calibration complete. " +
        "Press Start Game.";

}


/* =========================
   SENSOR VALUES
   ========================= */

let lastBeta = null;

let lastGamma = null;


/* =========================
   ORIENTATION HANDLER
   ========================= */

function handleOrientation(event) {

    /*
     * Store the latest sensor values.
     */

    if (
        event.beta !== null
    ) {

        lastBeta =
            event.beta;

    }


    if (
        event.gamma !== null
    ) {

        lastGamma =
            event.gamma;

    }


    /*
     * Display the values.
     */

    if (
        lastBeta !== null
    ) {

        betaDisplay.textContent =
            lastBeta.toFixed(1);

    }


    if (
        lastGamma !== null
    ) {

        gammaDisplay.textContent =
            lastGamma.toFixed(1);

    }


    /*
     * Don't control the ball until
     * the game has started.
     */

    if (
        !gameStarted
    ) {

        return;

    }


    /*
     * Make sure calibration exists.
     */

    if (
        calibratedBeta === null ||
        calibratedGamma === null
    ) {

        return;

    }


    /*
     * Calculate movement away
     * from the calibrated position.
     */

    const betaDifference =
        lastBeta -
        calibratedBeta;


    const gammaDifference =
        lastGamma -
        calibratedGamma;


    /* =========================
       DEAD ZONE
       ========================= */

    let horizontalTilt =
        gammaDifference;


    let verticalTilt =
        betaDifference;


    if (
        Math.abs(horizontalTilt)
        < deadZone
    ) {

        horizontalTilt = 0;

    }


    if (
        Math.abs(verticalTilt)
        < deadZone
    ) {

        verticalTilt = 0;

    }


    /* =========================
       ACCELERATION
       ========================= */

    velocityX +=
        horizontalTilt *
        acceleration;


    velocityY +=
        verticalTilt *
        acceleration;


    /*
     * Limit maximum speed.
     */

    velocityX =
        Math.max(
            -maxSpeed,
            Math.min(
                maxSpeed,
                velocityX
            )
        );


    velocityY =
        Math.max(
            -maxSpeed,
            Math.min(
                maxSpeed,
                velocityY
            )
        );

}


/* =========================
   BALL PHYSICS
   ========================= */

function updateBall() {

    /*
     * Apply velocity.
     */

    ballX += velocityX;

    ballY += velocityY;


    /*
     * Apply friction.
     */

    velocityX *= friction;

    velocityY *= friction;


    /*
     * Keep ball inside screen.
     */

    const radius = 35;


    if (
        ballX < radius
    ) {

        ballX = radius;

        velocityX *= -0.5;

    }


    if (
        ballX >
        window.innerWidth - radius
    ) {

        ballX =
            window.innerWidth - radius;

        velocityX *= -0.5;

    }


    if (
        ballY < radius
    ) {

        ballY = radius;

        velocityY *= -0.5;

    }


    if (
        ballY >
        window.innerHeight - radius
    ) {

        ballY =
            window.innerHeight - radius;

        velocityY *= -0.5;

    }


    /*
     * Update HTML position.
     */

    ball.style.left =
        ballX + "px";


    ball.style.top =
        ballY + "px";


    /*
     * Display velocity.
     */

    velocityXDisplay.textContent =
        velocityX.toFixed(2);


    velocityYDisplay.textContent =
        velocityY.toFixed(2);

}


/* =========================
   ANIMATION LOOP
   ========================= */

function gameLoop() {

    if (gameStarted) {

        updateBall();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/*
 * Start animation loop.
 */

gameLoop();


/* =========================
   START SENSOR
   ========================= */

async function startSensors() {

    /*
     * iPhone Safari requires
     * explicit permission.
     */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission ===
                "granted"
            ) {

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                sensorActive = true;

                return true;

            }

            else {

                statusDisplay.textContent =
                    "Motion permission denied.";

                return false;

            }

        }

        catch (error) {

            console.error(
                error
            );

            statusDisplay.textContent =
                "Motion permission error.";

            return false;

        }

    }


    /*
     * Browsers that don't require
     * explicit permission.
     */

    window.addEventListener(
        "deviceorientation",
        handleOrientation
    );


    sensorActive = true;

    return true;

}


/* =========================
   CALIBRATE BUTTON
   ========================= */

calibrateButton.addEventListener(
    "click",
    function() {

        calibrate();

    }
);


/* =========================
   START BUTTON
   ========================= */

startButton.addEventListener(
    "click",
    async function() {


        /*
         * Make sure we have
         * sensor permission.
         */

        if (!sensorActive) {

            const success =
                await startSensors();


            if (!success) {

                return;

            }

        }


        /*
         * We need calibration
         * before starting.
         */

        if (
            calibratedBeta === null ||
            calibratedGamma === null
        ) {

            statusDisplay.textContent =
                "Please calibrate first.";

            return;

        }


        /*
         * Start camera.
         */

        await startCamera();


        /*
         * Start game.
         */

        gameStarted = true;


        /*
         * Reset velocity.
         */

        velocityX = 0;

        velocityY = 0;


        statusDisplay.textContent =
            "Game started! Pick up the phone.";


        /*
         * Disable calibration while
         * game is running.
         */

        calibrateButton.disabled =
            true;


        startButton.disabled =
            true;

    }
);


/* =========================
   INITIAL BALL POSITION
   ========================= */

ball.style.left =
    ballX + "px";


ball.style.top =
    ballY + "px";


</script>

</body>

</html>
