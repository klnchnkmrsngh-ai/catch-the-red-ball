<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Catch the Red Ball</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* -------------------------
           CAMERA
           ------------------------- */

        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* -------------------------
           GAME OVERLAY
           ------------------------- */

        #game {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /* -------------------------
           RED BALL
           ------------------------- */

        #ball {

            position: absolute;

            width: 70px;
            height: 70px;

            background: red;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: auto;

            box-shadow:
                0 0 15px
                rgba(255, 0, 0, 0.8);
        }


        /* -------------------------
           START BUTTON
           ------------------------- */

        #startButton {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            padding: 15px 25px;

            font-size: 20px;

            z-index: 10;

            pointer-events: auto;
        }


        /* -------------------------
           SENSOR DISPLAY
           ------------------------- */

        #sensorDisplay {

            position: absolute;

            top: 20px;
            left: 20px;

            padding: 12px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-family: monospace;

            font-size: 15px;

            line-height: 1.5;

            border-radius: 8px;

            z-index: 20;

            pointer-events: none;
        }

    </style>

</head>


<body>


<!-- =========================
     CAMERA
     ========================= -->

<video id="camera"
       autoplay
       playsinline>
</video>


<!-- =========================
     GAME
     ========================= -->

<div id="game">


    <!-- Red ball -->

    <div id="ball"></div>


    <!-- Start button -->

    <button id="startButton">
        Start Game
    </button>


    <!-- Sensor information -->

    <div id="sensorDisplay">

        Alpha:
        <span id="alpha">---</span>

        <br>

        Beta:
        <span id="beta">---</span>

        <br>

        Gamma:
        <span id="gamma">---</span>

        <br><br>

        Ball X:
        <span id="ballX">---</span>

        <br>

        Ball Y:
        <span id="ballY">---</span>

    </div>


</div>


<script>


/* =========================
   HTML ELEMENTS
   ========================= */

const camera =
    document.getElementById(
        "camera"
    );


const ball =
    document.getElementById(
        "ball"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const alphaDisplay =
    document.getElementById(
        "alpha"
    );


const betaDisplay =
    document.getElementById(
        "beta"
    );


const gammaDisplay =
    document.getElementById(
        "gamma"
    );


const ballXDisplay =
    document.getElementById(
        "ballX"
    );


const ballYDisplay =
    document.getElementById(
        "ballY"
    );


/* =========================
   BALL POSITION
   ========================= */

/*
 * Start the ball in the
 * middle of the screen.
 */

let ballX =
    window.innerWidth / 2;


let ballY =
    window.innerHeight / 2;


/*
 * How strongly the phone
 * movement affects the ball.
 */

const sensitivity = 5;


/* =========================
   STARTING ORIENTATION
   ========================= */

/*
 * When the game starts,
 * we'll remember the phone's
 * current orientation.
 */

let startingBeta = null;

let startingGamma = null;


/* =========================
   CAMERA
   ========================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        }

                    },

                    audio: false

                });


        camera.srcObject =
            stream;

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        alert(
            "Could not access camera.\n\n" +
            error.name +
            "\n\n" +
            error.message
        );

    }

}


/* =========================
   UPDATE BALL
   ========================= */

function updateBall() {

    /*
     * Keep the ball inside
     * the screen.
     */

    const radius = 35;


    if (ballX < radius) {

        ballX = radius;

    }


    if (
        ballX >
        window.innerWidth - radius
    ) {

        ballX =
            window.innerWidth - radius;

    }


    if (ballY < radius) {

        ballY = radius;

    }


    if (
        ballY >
        window.innerHeight - radius
    ) {

        ballY =
            window.innerHeight - radius;

    }


    /*
     * Move the HTML ball.
     */

    ball.style.left =
        ballX + "px";


    ball.style.top =
        ballY + "px";


    /*
     * Display position.
     */

    ballXDisplay.textContent =
        Math.round(ballX);


    ballYDisplay.textContent =
        Math.round(ballY);

}


/* =========================
   ORIENTATION
   ========================= */

function handleOrientation(event) {

    /*
     * Read sensor values.
     */

    const alpha =
        event.alpha;


    const beta =
        event.beta;


    const gamma =
        event.gamma;


    /*
     * Display raw values.
     */

    if (alpha !== null) {

        alphaDisplay.textContent =
            alpha.toFixed(1);

    }


    if (beta !== null) {

        betaDisplay.textContent =
            beta.toFixed(1);

    }


    if (gamma !== null) {

        gammaDisplay.textContent =
            gamma.toFixed(1);

    }


    /*
     * We need beta and gamma
     * to control the ball.
     */

    if (
        beta === null ||
        gamma === null
    ) {

        return;

    }


    /*
     * Remember the phone's
     * starting orientation.
     */

    if (
        startingBeta === null
    ) {

        startingBeta = beta;

    }


    if (
        startingGamma === null
    ) {

        startingGamma = gamma;

    }


    /*
     * Calculate how far the
     * phone has moved from
     * its starting position.
     */

    const betaChange =
        beta - startingBeta;


    const gammaChange =
        gamma - startingGamma;


    /*
     * Move the ball.
     *
     * Gamma controls X.
     * Beta controls Y.
     */

    ballX =
        window.innerWidth / 2
        +
        gammaChange * sensitivity;


    ballY =
        window.innerHeight / 2
        +
        betaChange * sensitivity;


    /*
     * Apply the new position.
     */

    updateBall();

}


/* =========================
   START GAME
   ========================= */

startButton.addEventListener(
    "click",
    async function() {


        /*
         * Hide button.
         */

        startButton.style.display =
            "none";


        /*
         * Start camera.
         */

        await startCamera();


        /*
         * Request orientation
         * permission.
         */

        if (
            typeof DeviceOrientationEvent !==
            "undefined"
        ) {


            /*
             * iPhone Safari.
             */

            if (
                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                try {

                    const permission =
                        await
                        DeviceOrientationEvent
                            .requestPermission();


                    if (
                        permission ===
                        "granted"
                    ) {

                        window.addEventListener(
                            "deviceorientation",
                            handleOrientation
                        );

                    }

                    else {

                        alert(
                            "Motion permission was not granted."
                        );

                    }

                }

                catch (error) {

                    console.error(
                        "Motion permission error:",
                        error
                    );

                    alert(
                        "Motion permission error:\n\n" +
                        error.name +
                        "\n" +
                        error.message
                    );

                }

            }

            /*
             * Other browsers.
             */

            else {

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

            }

        }

        else {

            alert(
                "Device orientation is not supported."
            );

        }


        /*
         * Start ball in centre.
         */

        ballX =
            window.innerWidth / 2;


        ballY =
            window.innerHeight / 2;


        updateBall();

    }
);


/* =========================
   INITIAL POSITION
   ========================= */

updateBall();


</script>

</body>

</html>
